name: GDPR checkout cache regression
on:
  pull_request:
    paths:
      - 'bootstrap.php'
      - 'includes/**'
      - 'admin/class-mailchimp-woocommerce-admin.php'
      - 'blocks/woocommerce-blocks-integration.php'
      - 'tests/regression/gdpr-fields-cache.php'
      - 'tests/integration/gdpr-fields-checkout.php'
      - '.github/workflows/gdpr-fields-cache.yml'
  push:
    branches: [master, '6.4']
    paths:
      - 'bootstrap.php'
      - 'includes/**'
      - 'admin/class-mailchimp-woocommerce-admin.php'
      - 'blocks/woocommerce-blocks-integration.php'
      - 'tests/regression/gdpr-fields-cache.php'
      - 'tests/integration/gdpr-fields-checkout.php'
      - '.github/workflows/gdpr-fields-cache.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wordpress: '6.2'
            woocommerce: '8.2.0'
          - php: '8.2'
            wordpress: '7.0'
            woocommerce: '11.2.1'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: gdpr_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          ini-values: memory_limit=512M
          tools: wp-cli
          coverage: none
      - run: php tests/regression/gdpr-fields-cache.php
      - run: MC_GDPR_TEST_WP_CRON=1 php tests/regression/gdpr-fields-cache.php
      - name: Install disposable WordPress and WooCommerce
        env:
          WP_VERSION: ${{ matrix.wordpress }}
          WC_VERSION: ${{ matrix.woocommerce }}
        run: |
          mkdir -p "$RUNNER_TEMP/gdpr-wp"
          cd "$RUNNER_TEMP/gdpr-wp"
          wp core download --version="$WP_VERSION"
          wp config create --dbname=gdpr_test --dbuser=root --dbpass='' --dbhost=127.0.0.1
          wp config set DISABLE_WP_CRON true --raw
          wp core install --url=http://localhost --title='GDPR test' --admin_user=localqa --admin_password=disposable-local-only --admin_email=qa@example.test --skip-email
          wp plugin install woocommerce --version="$WC_VERSION" --activate
          ln -s "$GITHUB_WORKSPACE" wp-content/plugins/mailchimp-for-woocommerce
          wp plugin activate mailchimp-for-woocommerce
      - name: Verify classic and Blocks checkout with real Action Scheduler
        env:
          MC_WOO_GDPR_LOCAL_QA: '1'
        run: |
          cd "$RUNNER_TEMP/gdpr-wp"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/gdpr-fields-checkout.php"
