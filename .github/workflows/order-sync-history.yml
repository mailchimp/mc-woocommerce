name: Order sync history regression
on:
  pull_request:
    paths:
      - 'bootstrap.php'
      - 'includes/**'
      - 'tests/regression/order-sync-history.php'
      - '.github/workflows/order-sync-history.yml'
  push:
    branches: [master, '6.4']
    paths:
      - 'bootstrap.php'
      - 'includes/**'
      - 'tests/regression/order-sync-history.php'
      - '.github/workflows/order-sync-history.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        php: ['7.4', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php tests/regression/order-sync-history.php
